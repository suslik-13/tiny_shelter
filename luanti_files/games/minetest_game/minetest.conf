announce_messages = Join our Discord: https://discord.gg/8MvaeeBqYz, Sometimes bad weather can take away your health, You can send messages to players who are offline using the mail in your inventory, At night there are more dangerous mobs, Don't leave bones near your home otherwise banshees will spawn on them, The server uses a chat translator and messages from other players will be translated into the language of your game menu, Write in the chat /rules to find out the rules of this server, You can communicate with players in the game even without entering the game use our Discord server for this: https://discord.gg/8MvaeeBqYz, If your plants are located in an area with constant rainfall - take care to protect it from bad weather, You can turn on the PVP mode with the /war command - but damage can only be done to users who like you have turned on the war mode, You can disable PVP with the /peace command and no players will be able to harm you but this does not apply to monsters, Trading is a good way to get new things or make some money, If you want to build railways ask SUSLIK for additional privileges for the construction and management of railways, You can build on any unprotected and unoccupied area of ​​the map

